name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-tests:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Fetch 7-Zip
        run: ./Scripts/fetch-7zz.sh
      - name: Run core tests
        run: ./Scripts/test-core.sh
